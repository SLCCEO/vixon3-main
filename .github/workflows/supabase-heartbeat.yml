name: Supabase keep-alive

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Ping protected health endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET repository secrets are required." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            "$SITE_URL/api/health" \
            --header "Authorization: Bearer $CRON_SECRET"
